name: Build Server Binaries

on:
  push:
    branches: [master]
    # Pushed by release.yml (changesets) with the release bot's token, so this
    # trigger fires. If a run is ever missed, dispatch this workflow on the tag
    # to publish the release.
    tags: ['@laplace.live/event-bridge-server@*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: linux-binaries
          - os: macos-latest
            artifact_name: darwin-binaries

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build on macOS
        if: matrix.os == 'macos-latest'
        working-directory: packages/server
        run: |
          mkdir -p dist
          go mod download
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/leb-server-darwin-arm64

      - name: Build on Linux
        if: matrix.os == 'ubuntu-latest'
        working-directory: packages/server
        run: |
          mkdir -p dist
          go mod download
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/leb-server-linux-x64
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/leb-server-linux-arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            packages/server/dist/leb-*

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go (for Windows build)
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build Windows binary
        shell: bash
        working-directory: packages/server
        run: |
          mkdir -p dist
          go mod download
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/leb-server-windows-x64.exe

      - name: Sign Windows binary with Trusted Signing
        if: startsWith(github.ref, 'refs/tags/@laplace.live/event-bridge-server@')
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: packages/server/dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          if-no-files-found: error
          path: |
            packages/server/dist/leb-server-windows-x64.exe

  # The only job with write access: builds (which run PR code) stay read-only.
  # Releases are immutable once published, so this publishes the server's
  # release with every binary attached at once.
  github-release:
    needs: [build-unix, build-windows]
    if: startsWith(github.ref, 'refs/tags/@laplace.live/event-bridge-server@')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: '*-binaries'
          path: dist
          merge-multiple: true

      - name: Publish the release with its binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sh .github/scripts/changelog-section.sh packages/server-bun/CHANGELOG.md "${TAG##*@}" > notes.md
          # An immutable release can't take a binary later, so refuse to publish without all of them.
          for binary in darwin-arm64 linux-x64 linux-arm64 windows-x64.exe; do
            if [ ! -s "dist/leb-server-$binary" ]; then
              echo "::error::Missing leb-server-$binary"
              exit 1
            fi
          done
          sh .github/scripts/publish-release.sh "$TAG" notes.md dist/leb-*
