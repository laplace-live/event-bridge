name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  # https://docs.npmjs.com/trusted-publishers
  contents: read
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Update npm
        run: sudo npm install -g npm@latest

      - name: Build packages
        run: bun run build:all

      # Release writes (the Version Packages PR, tags and GitHub Releases) use
      # a GitHub App token instead of `GITHUB_TOKEN`. Events caused by
      # `GITHUB_TOKEN` don't trigger other workflows, so the server's Releases
      # would never start build.yml, and checks on the Version Packages PR
      # would wait for manual approval.
      #
      # Requires the laplace-release-bot GitHub App installed on this repo with
      # Contents and Pull requests read & write, its Client ID and private key
      # stored in the `RELEASE_APP_CLIENT_ID` and `RELEASE_APP_PRIVATE_KEY` org
      # secrets.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: bun run release
          version-script: bun run version
          # The Release this creates for @laplace.live/event-bridge-server
          # fires build.yml's `release: created` trigger, which builds the
          # server binaries and uploads them to it. v2 reads the token only
          # from this input, not from the `GITHUB_TOKEN` env var.
          github-token: ${{ steps.app-token.outputs.token }}
